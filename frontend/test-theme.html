<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-white dark:bg-slate-900 text-gray-900 dark:text-white min-h-screen p-8">
    <h1 class="text-4xl font-bold mb-4">Theme Toggle Test</h1>
    <p class="mb-4">Current theme: <span id="theme-display">light</span></p>
    <button id="toggle-btn" class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
        Toggle Theme
    </button>
    
    <div class="mt-8 p-6 bg-gray-100 dark:bg-gray-800 rounded-lg">
        <p>This box should change color when you toggle the theme.</p>
    </div>

    <script>
        const btn = document.getElementById('toggle-btn');
        const display = document.getElementById('theme-display');
        
        // Initialize
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        }
        display.textContent = savedTheme;
        
        btn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark');
            const newTheme = isDark ? 'light' : 'dark';
            
            if (newTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            
            localStorage.setItem('theme', newTheme);
            display.textContent = newTheme;
            
            console.log('Theme toggled to:', newTheme);
            console.log('HTML classes:', document.documentElement.className);
        });
    </script>
</body>
</html>
